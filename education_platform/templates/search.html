{% extends "base.html" %}
{% block title %}Поиск курсов — EduHub{% endblock %}

{% block content %}
<div style="max-width:1100px;margin:0 auto;padding:32px 24px 80px;">
  <!-- Заголовок и поисковая строка -->
  <div style="margin-bottom:32px;" class="reveal">
    <h1 style="font-size:2rem;font-weight:700;margin-bottom:20px;">🔍 Поиск курсов</h1>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <input type="text" id="search-q" class="form-input" style="flex:2;min-width:200px;" placeholder="Введите название или ключевое слово..." />
      <select id="search-category" class="form-input" style="max-width:200px;">
        <option value="">Все категории</option>
        {% for cat in categories %}
        <option value="{{ cat.id }}">{{ cat.name }}</option>
        {% endfor %}
      </select>
      <select id="search-level" class="form-input" style="max-width:180px;">
        <option value="">Все уровни</option>
        <option value="Beginner">Начинающий</option>
        <option value="Intermediate">Средний</option>
        <option value="Advanced">Продвинутый</option>
      </select>
      <select id="search-sort" class="form-input" style="max-width:180px;">
        <option value="rating">По рейтингу</option>
        <option value="newest">Новые</option>
        <option value="oldest">Старые</option>
      </select>
    </div>
  </div>

  <!-- Результаты -->
  <p id="search-info" style="color:var(--text-muted);margin-bottom:20px;font-size:.9rem;"></p>
  <div id="search-results" class="courses-grid"></div>
  <div id="search-empty" style="display:none;">
    <div class="empty-state">
      <span class="empty-icon">🔍</span>
      <p>Ничего не найдено. Попробуйте другой запрос.</p>
    </div>
  </div>

  <!-- Пагинация -->
  <div id="search-pagination" style="display:flex;justify-content:center;gap:8px;margin-top:32px;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function(){
  const qInput   = document.getElementById('search-q');
  const catSel   = document.getElementById('search-category');
  const lvlSel   = document.getElementById('search-level');
  const sortSel  = document.getElementById('search-sort');
  const results  = document.getElementById('search-results');
  const emptyEl  = document.getElementById('search-empty');
  const infoEl   = document.getElementById('search-info');
  const pagEl    = document.getElementById('search-pagination');
  let debounceTimer;
  function doSearch(page) {
    currentPage = page || 1;
    const params = new URLSearchParams({
      q: qInput.value,
      category_id: catSel.value || 0,
      level: lvlSel.value,
      sort: sortSel.value,
      page: currentPage,
      per_page: 12
    });

    fetch('/api/search?' + params)
      .then(r => r.json())
      .then(data => {
        results.innerHTML = '';
        emptyEl.style.display = 'none';

        if (data.courses.length === 0) {
          emptyEl.style.display = 'block';
          infoEl.textContent = '';
          pagEl.innerHTML = '';
          return;
        }

        infoEl.textContent = 'Найдено: ' + data.total + ' курс(ов)';

        data.courses.forEach((c, i) => {
          const card = document.createElement('div');
          card.className = 'course-card';
          card.style.animation = 'fadeInUp .4s ' + (i * 0.05) + 's ease both';
          const stars = '★'.repeat(Math.round(c.rating)) + '☆'.repeat(5 - Math.round(c.rating));
          card.innerHTML = `
            <div class="course-card-header">
              <span class="course-icon">📖</span>
              ${c.category ? '<span class="category-badge">' + c.category + '</span>' : ''}
            </div>
            <div class="course-card-body">
              <h3 class="course-title">${c.title}</h3>
              <p class="course-desc">${c.description || 'Нет описания'}</p>
              <div class="course-meta">
                <span class="course-teacher">👨‍🏫 ${c.teacher_name}</span>
                <span style="color:#f59e0b;font-size:.85rem;">${stars} ${c.rating.toFixed(1)}</span>
              </div>
              <div style="display:flex;gap:8px;margin-top:4px;">
                <span style="font-size:.78rem;padding:2px 8px;border-radius:20px;background:var(--primary-light);color:var(--primary);font-weight:600;">${c.level}</span>
              </div>
            </div>
            <div class="course-card-footer">
              <a href="/courses/${c.id}" class="btn btn-primary btn-sm">Подробнее →</a>
            </div>
          `;
          results.appendChild(card);
        });

        // Пагинация
        const totalPages = Math.ceil(data.total / data.per_page);
        pagEl.innerHTML = '';
        for (let p = 1; p <= totalPages; p++) {
          const btn = document.createElement('button');
          btn.textContent = p;
          btn.className = 'btn ' + (p === currentPage ? 'btn-primary' : 'btn-secondary') + ' btn-sm';
          btn.onclick = () => doSearch(p);
          pagEl.appendChild(btn);
        }
      });
  }

  // Debounce при вводе
  qInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => doSearch(1), 400);
  });
  catSel.addEventListener('change', () => doSearch(1));
  lvlSel.addEventListener('change', () => doSearch(1));
  sortSel.addEventListener('change', () => doSearch(1));

  // Начальный поиск (чтение 'q' из URL если есть)
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('q')) {
    qInput.value = urlParams.get('q');
  }
  
  doSearch(1);
})();
</script>
{% endblock %}
