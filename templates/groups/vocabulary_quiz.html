{% extends "base.html" %}
{% block title_key %}vocabulary.section_title{% endblock %}
{% block title %}{{ vocab.title }} — {{ group.name }} — Фурузон{% endblock %}

{% block content %}
<script>
const VOCAB_ITEMS = {{ items_json | safe }};
const EXISTING_ANSWERS = {{ existing_answers_json | safe | default('[]', true) }};
const ATTEMPT_ID = {{ attempt_id | default('null', true) }};
const VOCAB_SUBMIT_ANSWER_URL = ATTEMPT_ID ? `/groups/{{ group.id }}/lessons/{{ lesson.id }}/vocabulary/{{ vocab.id }}/attempts/${ATTEMPT_ID}/answer` : null;
const VOCAB_COMPLETE_URL = ATTEMPT_ID ? `/groups/{{ group.id }}/lessons/{{ lesson.id }}/vocabulary/{{ vocab.id }}/attempts/${ATTEMPT_ID}/complete` : null;
const VOCAB_BACK_URL = "/groups/{{ group.id }}/lessons/{{ lesson.id }}";
const VOCAB_RESULT_URL = "/groups/{{ group.id }}/lessons/{{ lesson.id }}/vocabulary/{{ vocab.id }}";
const CURRENT_LANG = (localStorage.getItem('lang') || 'ru');
</script>

<div class="vocab-quiz-wrap" id="vocab-quiz-wrap">
  <div class="vocab-progress-bar-wrap">
    <div class="vocab-progress-bar" id="vocab-progress-bar" style="width:0%"></div>
  </div>
  <div class="vocab-quiz-header">
    <a href="#" id="vocab-quit-link" class="vocab-quit-link" onclick="return confirmQuit(event)">
      ✕ <span data-i18n="vocabulary.quit">Выйти</span>
    </a>
    <span class="vocab-counter" id="vocab-counter">1 / {{ vocab.items | length }}</span>
  </div>

  <div class="vocab-card" id="vocab-card">
    <div class="vocab-card-inner" id="vocab-card-inner">
      <div id="vocab-screen-word" class="vocab-screen">
        <div class="vocab-word-label" data-i18n="vocabulary.word_label">Слово</div>
        <div class="vocab-word" id="vocab-word-display"></div>
        <div class="vocab-input-wrap">
          <input type="text" id="vocab-answer-input" class="vocab-answer-input form-input"
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            data-i18n="vocabulary.answer_placeholder" data-i18n-prop="placeholder"
            placeholder="Введите перевод..." />
          <button class="btn btn-primary vocab-check-btn" id="vocab-check-btn" onclick="checkAnswer()">
            <span data-i18n="vocabulary.check_btn">Проверить</span>
          </button>
        </div>
        <button class="btn btn-outline vocab-skip-btn" onclick="skipWord()">
          <span data-i18n="vocabulary.skip_btn">Пропустить</span>
        </button>
      </div>

      <div id="vocab-screen-result" class="vocab-screen" style="display:none;">
        <div class="vocab-result-icon" id="vocab-result-icon"></div>
        <div class="vocab-result-status" id="vocab-result-status"></div>
        <div class="vocab-result-word" id="vocab-result-word-display"></div>
        <div class="vocab-result-answer-wrap">
          <div class="vocab-result-row">
            <span class="vocab-result-label" data-i18n="vocabulary.your_answer">Ваш ответ:</span>
            <span class="vocab-result-value" id="vocab-user-answer-display"></span>
          </div>
          <div class="vocab-result-row" id="vocab-correct-row">
            <span class="vocab-result-label" data-i18n="vocabulary.correct_answer">Правильный ответ:</span>
            <span class="vocab-result-value" id="vocab-correct-answer-display"></span>
          </div>
        </div>
        <button class="btn btn-primary vocab-next-btn" onclick="nextWord()">
          <span data-i18n="vocabulary.next_btn">Далее →</span>
        </button>
      </div>
    </div>
  </div>
</div>

<style>
.vocab-quiz-wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; min-height: 80vh; display: flex; flex-direction: column; }
.vocab-progress-bar-wrap { height: 4px; background: var(--border-light, rgba(0,0,0,0.08)); border-radius: 2px; overflow: hidden; margin-bottom: 20px; }
.vocab-progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), #818cf8); border-radius: 2px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
.vocab-quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
.vocab-quit-link { color: var(--text-muted); font-size: 0.85rem; text-decoration: none; }
.vocab-quit-link:hover { color: var(--error); }
.vocab-counter { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }
.vocab-card { flex: 1; background: var(--bg-card); border: 1px solid rgba(0,0,0,0.07); border-radius: 20px; padding: 40px 36px; box-shadow: 0 4px 24px rgba(99,102,241,0.07); display: flex; flex-direction: column; }
.vocab-card-inner { flex: 1; display: flex; flex-direction: column; }
.vocab-screen { display: flex; flex-direction: column; flex: 1; gap: 20px; }
.vocab-word-label { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
.vocab-word { font-size: 2rem; font-weight: 700; color: var(--text); line-height: 1.2; word-break: break-word; }
.vocab-input-wrap { display: flex; gap: 10px; align-items: stretch; }
.vocab-answer-input { flex: 1; font-size: 1rem; padding: 12px 16px; border-radius: 12px; }
.vocab-check-btn { padding: 12px 20px; border-radius: 12px; white-space: nowrap; }
.vocab-skip-btn { align-self: flex-start; padding: 8px 16px; font-size: 0.85rem; border-radius: 10px; color: var(--text-muted); border-color: var(--border-light, rgba(0,0,0,0.1)); }
.vocab-result-icon { font-size: 3rem; text-align: center; line-height: 1; }
.vocab-result-status { text-align: center; font-size: 1.15rem; font-weight: 700; }
.vocab-result-word { font-size: 1.6rem; font-weight: 700; color: var(--text); text-align: center; word-break: break-word; }
.vocab-result-answer-wrap { background: var(--bg-secondary, #f8fafc); border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.vocab-result-row { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; flex-wrap: wrap; }
.vocab-result-label { color: var(--text-muted); flex-shrink: 0; }
.vocab-result-value { font-weight: 600; color: var(--text); word-break: break-word; }
.vocab-next-btn { padding: 14px 24px; border-radius: 12px; font-size: 1rem; justify-content: center; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
.shake { animation: shake 0.4s ease; }
@media (max-width: 480px) {
  .vocab-card { padding: 28px 18px; }
  .vocab-word { font-size: 1.5rem; }
  .vocab-input-wrap { flex-direction: column; }
  .vocab-check-btn { width: 100%; justify-content: center; }
}
</style>

<script>
let currentIndex = EXISTING_ANSWERS ? EXISTING_ANSWERS.length : 0;
const answers = EXISTING_ANSWERS ? [...EXISTING_ANSWERS] : [];

// \u0422\u0430\u0434\u0436\u0438\u043a\u0441\u043a\u0438\u0435 \u044d\u043a\u0432\u0438\u0432\u0430\u043b\u0435\u043d\u0442\u044b: \u043e\u0431\u0435 \u0441\u0442\u043e\u0440\u043e\u043d\u044b (tj-\u0431\u0443\u043a\u0432\u0430 \u2192 \u0440\u0443\u0441\u0441\u043a\u0430\u044f \u0438 \u043d\u0430\u043e\u0431\u043e\u0440\u043e\u0442)
const TJ_EQUIV = [
  ['\u04e3', '\u0438'],  // \u04e3 \u2194 \u0438
  ['\u04ef', '\u0443'],  // \u04ef \u2194 \u0443
  ['\u0493', '\u0433'],  // \u0493 \u2194 \u0433
  ['\u049b', '\u043a'],  // \u049b \u2194 \u043a
  ['\u04b3', '\u0445'],  // \u04b3 \u2194 \u0445
  ['\u04b7', '\u0447'],  // \u04b7 \u2194 \u0447
];

function normalizeTajik(str) {
  let s = str;
  for (const [tj, ru] of TJ_EQUIV) {
    // \u0417\u0430\u043c\u0435\u043d\u044f\u0435\u043c \u043e\u0431\u0430 \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u043d\u0430 ru-\u0432\u0430\u0440\u0438\u0430\u043d\u0442 (\u043a\u0430\u043d\u043e\u043d\u0438\u0437\u0430\u0446\u0438\u044f \u043a \u043e\u0434\u043d\u043e\u043c\u0443 \u044f\u0437\u044b\u043a\u0443)
    s = s.replaceAll(tj, ru).replaceAll(tj.toUpperCase(), ru.toUpperCase());
  }
  return s;
}

function normalizeAnswer(str) {
  if (!str) return '';
  return normalizeTajik(
    str.toLowerCase().trim()
      .replace(/\s+/g, ' ')
      .replace(/[.,!?;:'"«»""]+$/g, '')
      .replace(/\u0451/g, '\u0435')  // \u0451 \u2192 \u0435
  );
}

function getAcceptedAnswers(item) {
  let source = '';
  if (CURRENT_LANG === 'ru' && item.accepted_answers_ru) source = item.accepted_answers_ru;
  else if (CURRENT_LANG === 'tj' && item.accepted_answers_tj) source = item.accepted_answers_tj;
  else source = item.accepted_answers || '';
  return source.split('|').map(a => a.trim()).filter(Boolean);
}

function showWord(index) {
  const item = VOCAB_ITEMS[index];
  document.getElementById('vocab-word-display').textContent = item.prompt_word;
  document.getElementById('vocab-answer-input').value = '';
  document.getElementById('vocab-counter').textContent = (index + 1) + ' / ' + VOCAB_ITEMS.length;
  document.getElementById('vocab-progress-bar').style.width = (index / VOCAB_ITEMS.length * 100) + '%';
  document.getElementById('vocab-card').className = 'vocab-card';
  document.getElementById('vocab-screen-word').style.display = 'flex';
  document.getElementById('vocab-screen-result').style.display = 'none';
  setTimeout(() => { const inp = document.getElementById('vocab-answer-input'); if (inp) inp.focus(); }, 100);
}

function checkAnswer() {
  const input = document.getElementById('vocab-answer-input');
  const userAnswer = (input.value || '').trim();
  if (!userAnswer) {
    input.classList.add('shake');
    setTimeout(() => input.classList.remove('shake'), 500);
    input.focus();
    return;
  }
  const item = VOCAB_ITEMS[currentIndex];
  const accepted = getAcceptedAnswers(item);
  const isCorrect = accepted.some(a => normalizeAnswer(a) === normalizeAnswer(userAnswer));
  showResult(item, userAnswer, isCorrect, accepted, false);
}

function skipWord() {
  const item = VOCAB_ITEMS[currentIndex];
  const accepted = getAcceptedAnswers(item);
  showResult(item, '', false, accepted, true);
}

async function showResult(item, userAnswer, isCorrect, accepted, skipped) {
  const card = document.getElementById('vocab-card');
  document.getElementById('vocab-result-icon').textContent = skipped ? '\u23ed' : (isCorrect ? '\u2705' : '\u274c');
  const statusEl = document.getElementById('vocab-result-status');
  if (skipped) { statusEl.textContent = t('vocabulary.skipped'); statusEl.style.color = 'var(--text-muted)'; }
  else if (isCorrect) { statusEl.textContent = t('vocabulary.correct'); statusEl.style.color = '#22c55e'; }
  else { statusEl.textContent = t('vocabulary.wrong'); statusEl.style.color = 'var(--error, #ef4444)'; }
  document.getElementById('vocab-result-word-display').textContent = item.prompt_word;
  document.getElementById('vocab-user-answer-display').textContent = userAnswer || '\u2014';
  document.getElementById('vocab-correct-answer-display').textContent = accepted.join(' / ');
  document.getElementById('vocab-correct-row').style.display = (skipped || !isCorrect) ? 'flex' : 'none';
  document.getElementById('vocab-screen-word').style.display = 'none';
  document.getElementById('vocab-screen-result').style.display = 'flex';

  answers.push({ item_id: item.id, student_answer: userAnswer, is_correct: isCorrect });
  
  if (VOCAB_SUBMIT_ANSWER_URL) {
    try {
      await fetch(VOCAB_SUBMIT_ANSWER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: item.id, student_answer: userAnswer, is_correct: isCorrect, lang: CURRENT_LANG }),
      });
    } catch (e) {
      console.error("Failed to save answer", e);
    }
  }
}

function nextWord() {
  currentIndex++;
  if (currentIndex >= VOCAB_ITEMS.length) {
    submitResults();
  } else {
    showWord(currentIndex);
  }
}

async function submitResults() {
  document.getElementById('vocab-progress-bar').style.width = '100%';
  if (!VOCAB_COMPLETE_URL) {
    window.location.href = VOCAB_RESULT_URL;
    return;
  }
  try {
    const resp = await fetch(VOCAB_COMPLETE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({}),
    });
    if (resp.status === 409) {
      // Уже проходил, повтор запрещён
      window.location.href = VOCAB_RESULT_URL;
      return;
    }
    if (!resp.ok) throw new Error();
    const data = await resp.json();
    window.location.href = VOCAB_RESULT_URL + '?score=' + data.score + '&total=' + data.total;
  } catch (e) {
    window.location.href = VOCAB_RESULT_URL;
  }
}

async function confirmQuit(e) {
  e.preventDefault();
  if (answers.length === 0 || await showConfirmModal(t('vocabulary.quit_confirm'))) {
    window.location.href = VOCAB_BACK_URL;
  }
  return false;
}

document.addEventListener('DOMContentLoaded', () => {
  if (!VOCAB_ITEMS.length) {
    document.getElementById('vocab-quiz-wrap').innerHTML = `<p style="text-align:center;padding:40px;" data-i18n="vocabulary.no_words">${t('vocabulary.no_words')}</p>`;
    return;
  }
  if (currentIndex >= VOCAB_ITEMS.length) {
    submitResults();
    return;
  }
  showWord(currentIndex);
  document.getElementById('vocab-answer-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
});
</script>
{% endblock %}
