{% extends "base.html" %}
{% block title_key %}vocabulary.section_title{% endblock %}
{% block title %}{{ vocab.title }} — {{ group.name }} — Фурузон{% endblock %}

{% block content %}
<script>
const VOCAB_ITEMS = {{ items_json | safe }};
const EXISTING_ANSWERS = {{ existing_answers_json | safe | default('[]', true) }};
const ATTEMPT_ID = {{ attempt_id | default('null', true) }};
const VOCAB_SUBMIT_ANSWER_URL = ATTEMPT_ID ? `/groups/{{ group.id }}/lessons/{{ lesson.id }}/vocabulary/{{ vocab.id }}/attempts/${ATTEMPT_ID}/answer` : null;
const VOCAB_COMPLETE_URL = ATTEMPT_ID ? `/groups/{{ group.id }}/lessons/{{ lesson.id }}/vocabulary/{{ vocab.id }}/attempts/${ATTEMPT_ID}/complete` : null;
const VOCAB_ANTICHEAT_SECOND_WARNING_URL = ATTEMPT_ID ? `/groups/{{ group.id }}/lessons/{{ lesson.id }}/vocabulary/{{ vocab.id }}/attempts/${ATTEMPT_ID}/anti-cheat/second-warning` : null;
const VOCAB_BACK_URL = "/groups/{{ group.id }}/lessons/{{ lesson.id }}";
const VOCAB_RESULT_URL = "/groups/{{ group.id }}/lessons/{{ lesson.id }}/vocabulary/{{ vocab.id }}";
const CURRENT_LANG = (localStorage.getItem('lang') || 'ru');
</script>

<div class="vocab-quiz-wrap" id="vocab-quiz-wrap">
  <div class="vocab-progress-bar-wrap">
    <div class="vocab-progress-bar" id="vocab-progress-bar" style="width:0%"></div>
  </div>
  <div class="vocab-quiz-header">
    <a href="#" id="vocab-quit-link" class="vocab-quit-link" onclick="return confirmQuit(event)">
      ✕ <span data-i18n="vocabulary.quit">Выйти</span>
    </a>
    <span class="vocab-counter" id="vocab-counter">1 / {{ vocab.items | length }}</span>
  </div>

  <div class="vocab-card" id="vocab-card">
    <div class="vocab-anticheat-notice" id="vocab-anticheat-notice" aria-live="polite" aria-hidden="true">
      <div class="vocab-anticheat-copy">
        <strong id="vocab-anticheat-title"></strong>
        <span id="vocab-anticheat-message"></span>
      </div>
      <button type="button" class="vocab-anticheat-close" id="vocab-anticheat-close"
              data-i18n="vocabulary.anticheat_dismiss" data-i18n-prop="aria-label"
              aria-label="vocabulary.anticheat_dismiss"></button>
    </div>
    <div class="vocab-card-inner" id="vocab-card-inner">
      <div id="vocab-screen-word" class="vocab-screen">
        <div class="vocab-word-label" data-i18n="vocabulary.word_label">Слово</div>
        <div class="vocab-word" id="vocab-word-display"></div>
        <div class="vocab-input-wrap">
          <input type="text" id="vocab-answer-input" class="vocab-answer-input form-input"
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            data-i18n="vocabulary.answer_placeholder" data-i18n-prop="placeholder"
            placeholder="Введите перевод..." />
          <button class="btn btn-primary vocab-check-btn" id="vocab-check-btn" onclick="checkAnswer()">
            <span data-i18n="vocabulary.check_btn">Проверить</span>
          </button>
        </div>
        <button class="btn btn-outline vocab-skip-btn" onclick="skipWord()">
          <span data-i18n="vocabulary.skip_btn">Пропустить</span>
        </button>
      </div>

      <div id="vocab-screen-result" class="vocab-screen" style="display:none;">
        <div class="vocab-result-icon" id="vocab-result-icon"></div>
        <div class="vocab-result-status" id="vocab-result-status"></div>
        <div class="vocab-result-word" id="vocab-result-word-display"></div>
        <div class="vocab-result-answer-wrap">
          <div class="vocab-result-row">
            <span class="vocab-result-label" data-i18n="vocabulary.your_answer">Ваш ответ:</span>
            <span class="vocab-result-value" id="vocab-user-answer-display"></span>
          </div>
          <div class="vocab-result-row" id="vocab-correct-row">
            <span class="vocab-result-label" data-i18n="vocabulary.correct_answer">Правильный ответ:</span>
            <span class="vocab-result-value" id="vocab-correct-answer-display"></span>
          </div>
        </div>
        <button class="btn btn-primary vocab-next-btn" onclick="nextWord()">
          <span data-i18n="vocabulary.next_btn">Далее →</span>
        </button>
      </div>
    </div>
  </div>
</div>

<link rel="stylesheet" href="{{ url_for('static', path='css/pages/vocabulary_quiz.css') }}">

<script src="{{ url_for('static', path='js/pages/vocabulary_quiz.js') }}"></script>
{% endblock %}
