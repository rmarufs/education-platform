<aside class="sidebar">
    <div class="sidebar-profile">
        <div class="avatar-upload-wrapper" onclick="document.getElementById('sidebar-avatar-input').click()" style="cursor:pointer;">
            {% if user.avatar_url %}
                <img src="{{ user.avatar_url }}" class="avatar" id="sidebar-avatar-img" alt="{{ user.name }}">
            {% else %}
                <div class="avatar avatar-placeholder" id="sidebar-avatar-placeholder">{% if org and org.name %}{{ org.name[0].upper() }}{% else %}{{ (user.name or "F")[0].upper() }}{% endif %}</div>
            {% endif %}
            <div class="avatar-upload-overlay" style="display:none">📷</div>
        </div>
        <input type="file" id="sidebar-avatar-input" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="uploadSidebarAvatar(this)">
        <div class="profile-info">
            <h3>{{ org.name if org else user.name }}</h3>
            <span class="role-badge" style="background:#ede9fe;color:#6d28d9;" data-i18n="role.organization">Учебный центр</span>
        </div>
    </div>
    <nav class="sidebar-nav">
        <a href="/dashboard/organization" class="sidebar-link {{ 'active' if active_page == 'dashboard' else '' }}">
            <span class="link-icon">📊</span>
            <span data-i18n="nav.overview">Обзор</span>
        </a>
        <a href="/organization/teachers" class="sidebar-link {{ 'active' if active_page == 'teachers' else '' }}">
            <span class="link-icon">👨‍🏫</span>
            <span data-i18n="org.nav_teachers">Преподаватели</span>
        </a>
        <a href="/organization/students" class="sidebar-link {{ 'active' if active_page == 'students' else '' }}">
            <span class="link-icon">🎓</span>
            <span data-i18n="org.nav_students">Ученики</span>
        </a>
        <a href="/groups/" class="sidebar-link {{ 'active' if active_page == 'groups' else '' }}">
            <span class="link-icon">🗂</span>
            <span data-i18n="group.title">Группы</span>
        </a>
        <a href="/organization/profile" class="sidebar-link {{ 'active' if active_page == 'profile' else '' }}">
            <span class="link-icon">⚙️</span>
            <span data-i18n="nav.profile">Профиль</span>
        </a>
        <a href="/logout" class="sidebar-link" data-logout-link>
            <span class="link-icon">🚪</span>
            <span data-i18n="nav.logout">Выйти</span>
        </a>
    </nav>
</aside>
