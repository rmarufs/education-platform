{% extends "base.html" %}
{% block title_key %}login.title_page{% endblock %}
{% block title %}Вход — Фурузон{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">🔑</span>
            <h1 data-i18n="login.title">Вход в аккаунт</h1>
            <p data-i18n="login.subtitle">Рады видеть вас снова!</p>
        </div>

        {% if error %}
        <div class="alert alert-error" id="error-msg" data-server-msg="{{ error }}">{{ error }}</div>
        {% endif %}

        <form id="login-form" action="/login" method="POST" class="auth-form" novalidate>
            <div class="form-group">
                <label for="email" data-i18n="form.email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    data-i18n="form.email_ph"
                    placeholder="you@example.com"
                    required
                    autocomplete="email"
                />
                <span class="form-error" id="email-error"></span>
            </div>

            <div class="form-group">
                <label for="password" data-i18n="form.password">Пароль</label>
                <div class="input-with-icon">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        data-i18n="form.pass_ph"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    />
                    <button type="button" class="toggle-password" onclick="togglePassword('password')">👁</button>
                </div>
                <span class="form-error" id="password-error"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-full" data-i18n="login.submit">Войти</button>
        </form>

        <div class="auth-footer">
            <p>
                <span data-i18n="login.no_account">Нет аккаунта?</span>
                <a href="/register" data-i18n="login.register_link">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
