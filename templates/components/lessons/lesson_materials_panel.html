<!-- Материалы -->
{% if lesson.materials %}
<section class="lesson-materials">
  <h3 data-i18n="lesson.materials">📎 Материалы</h3>
  <ul class="materials-list">
    {% for m in lesson.materials %}
    <li class="material-item">
      <span class="material-icon">
        {% if m.file_type == "pdf" %}🔴{% elif m.file_type in ["ppt","pptx"] %}🟠{% else %}📄{% endif %}
      </span>
      <a href="{{ m.file_url }}" target="_blank" rel="noopener">
        {{ m.title or m.file_url.split("/")[-1] }}
      </a>
      <span class="badge">{{ m.file_type | upper }}</span>
    </li>
    {% endfor %}
  </ul>
</section>
{% endif %}
