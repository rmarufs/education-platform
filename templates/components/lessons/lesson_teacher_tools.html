<!-- Учитель: добавить материал / квиз -->
{% if user and user.is_teacher %}
<section class="teacher-tools">
  <h3 data-i18n="lesson.tools">⚙️ Инструменты преподавателя</h3>
  <div class="teacher-tools-grid">

    <!-- Добавить материал -->
    <form action="/lessons/{{ lesson.id }}/material" method="POST" class="tool-form">
      <h4 data-i18n="lesson.add_mat">📎 Добавить материал</h4>
      <input type="text" name="title" class="form-input" data-i18n="lesson.mat_title" placeholder="Название" />
      <input type="url" name="file_url" class="form-input" data-i18n="lesson.mat_link" placeholder="Ссылка на файл" required />
      <select name="file_type" class="form-input">
        <option value="pdf">PDF</option>
        <option value="doc">DOC</option>
        <option value="docx">DOCX</option>
      </select>
      <button type="submit" class="btn btn-outline btn-sm" data-i18n="lesson.mat_add">Добавить</button>
    </form>

    <!-- Google Forms тест -->
    <div class="tool-form">
      <h4>📋 Управление тестом</h4>
      {{ render_google_forms_editor(lesson.quiz_url, "lesson", lesson.id, "Урок: " ~ lesson.title) }}
    </div>

  </div>
</section>
{% endif %}
