<div class="course-card fade-in">
    <div class="course-card-header">
        {{ course_cover(item.course) }}
    </div>
    <div class="course-card-body">
        <h3 class="course-title">{{ item.course.title }}</h3>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px; margin-bottom: 10px;">
            <div style="flex-grow: 1; height: 6px; background: var(--surface-strong); border-radius: 3px; overflow: hidden;">
                <div style="height: 100%; background: {{ 'linear-gradient(90deg, var(--success), #22c55e)' if item.progress_pct == 100 else 'linear-gradient(90deg, var(--primary), var(--primary-dark))' }}; width: {{ item.progress_pct }}%;"></div>
            </div>
            <span style="font-size: 0.875rem; font-weight: 600; color: var(--text);">{{ item.progress_pct }}%</span>
        </div>
        <p class="course-desc" style="-webkit-line-clamp: 2;">{{ (item.course.description or "") | striptags }}{% if not item.course.description %}<span data-i18n="common.no_desc">Нет описания</span>{% endif %}</p>
    </div>
    <div class="course-card-footer" style="display: flex; flex-direction: column; gap: 8px;">
        {% if item.continue_url %}
        <a href="{{ item.continue_url }}" class="btn btn-primary btn-sm btn-full" title="{{ item.last_lesson.title if item.last_lesson else item.course.title }}"><span aria-hidden="true">▶</span> <span data-i18n="course_page.continue_learning">Продолжить</span></a>
        {% else %}
        <a href="/courses/{{ item.course.id }}" class="btn btn-primary btn-sm btn-full"><span aria-hidden="true">▶</span> <span data-i18n="course_page.continue_learning">Продолжить</span></a>
        {% endif %}
        <a href="/courses/{{ item.course.id }}" class="btn btn-outline btn-sm btn-full" data-i18n="manage.view">👁 Просмотр</a>
    </div>
</div>
