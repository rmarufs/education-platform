{% if lesson.vocabularies %}
<section class="lesson-materials vocab-lesson-section">
  <h3 data-i18n="vocabulary.section_title">📚 Словари</h3>
  <div class="vocab-cards-list">
    {% for vocab in lesson.vocabularies %}
    {% include "components/groups/vocab_card.html" %}
    {% endfor %}
  </div>
  {% if can_preview_as_owner %}
  <a href="/groups/{{ group.id }}/lessons/{{ lesson.id }}/vocabulary/create"
     class="btn btn-outline btn-sm" style="margin-top: 12px;">
    + <span data-i18n="vocabulary.add_vocab">Добавить словарь</span>
  </a>
  {% endif %}
</section>
{% elif can_preview_as_owner %}
<section class="lesson-materials vocab-lesson-section">
  <h3 data-i18n="vocabulary.section_title">📚 Словари</h3>
  <div class="empty-state" style="padding: 20px 0;">
    <p class="text-muted" data-i18n="vocabulary.no_vocabs">Словарей пока нет.</p>
  </div>
  <a href="/groups/{{ group.id }}/lessons/{{ lesson.id }}/vocabulary/create"
     class="btn btn-outline btn-sm">
    + <span data-i18n="vocabulary.add_vocab">Добавить словарь</span>
  </a>
</section>
{% endif %}
