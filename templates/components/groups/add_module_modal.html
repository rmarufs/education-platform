<div class="modal-overlay" id="add-module-modal" onclick="if(event.target===this) closeModal('add-module-modal')">
    <div class="modal">
        {% if authoring_context == 'group' or not authoring_context %}
        <div class="modal-header">
            <h2 data-i18n="group.new_module">Новый модуль</h2>
            <button class="modal-close" onclick="closeModal('add-module-modal')">✕</button>
        </div>
        <form action="{{ module_add_action }}" method="POST">
            <div class="modal-scroll-body">
                <div class="form-group">
                    <label for="gm-title" data-i18n="group.module_title">Название модуля</label>
                    <input type="text" id="gm-title" name="title" class="form-input" required data-i18n="group.module_title_ph" data-i18n-prop="placeholder" placeholder="Например: Модуль 1" />
                </div>
                <div class="form-group">
                    <label for="gm-order" data-i18n="group.module_order">Порядок модуля</label>
                    <input type="number" id="gm-order" name="order_index" class="form-input" value="{{ group_modules|length }}" min="0" />
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('add-module-modal')" data-i18n="group.cancel">Отмена</button>
                <button type="submit" class="btn btn-primary" data-i18n="group.add_module">+ Добавить модуль</button>
            </div>
        </form>
        {% elif authoring_context == 'course' %}
        <div class="modal-header">
            <h2 data-i18n="manage.new_module">Новый модуль</h2>
            <button class="modal-close" onclick="closeModal('add-module-modal')">✕</button>
        </div>
        <form action="{{ module_add_action }}" method="POST">
            <input type="hidden" name="course_id" value="{{ course.id }}" />
            <div class="modal-scroll-body">
                <div class="form-group">
                    <label for="m-title" data-i18n="manage.new_mod_ph">Название нового модуля</label>
                    <input type="text" id="m-title" name="title" class="form-input" data-i18n="manage.new_mod_ph" data-i18n-prop="placeholder" required />
                </div>
                <div class="form-group">
                    <label data-i18n="manage.module_desc">Описание модуля</label>
                    <div class="rich-editor">
                        <input type="hidden" id="m-desc-input" name="description" class="rich-editor-input" value="" />
                        <div class="rich-editor-shell">
                            <div id="m-desc-surface" class="rich-editor-surface" contenteditable="true"
                                 data-placeholder="Описание модуля"
                                 data-i18n="manage.module_desc"
                                 data-i18n-prop="data-placeholder"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('add-module-modal')" data-i18n="action.cancel">Отмена</button>
                <button type="submit" class="btn btn-primary" data-i18n="manage.add_mod_btn">+ Модуль</button>
            </div>
        </form>
        {% endif %}
    </div>
</div>
