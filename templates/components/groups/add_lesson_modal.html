{% set add_lesson_modal_overlay_onclick = add_lesson_modal_overlay_onclick | default("if(event.target===this) closeModal('add-lesson-modal')") %}
<div class="modal-overlay" id="add-lesson-modal" onclick="{{ add_lesson_modal_overlay_onclick }}">
    <div class="modal"{% if add_lesson_modal_stop_propagation | default(false) %} onclick="event.stopPropagation()"{% endif %}>
        <div class="modal-header">
            <h2 data-i18n="group.new_lesson">Новый урок</h2>
            <button class="modal-close" onclick="closeModal('add-lesson-modal')">✕</button>
        </div>
        <form action="/groups/{{ group.id }}/lessons/create" method="POST" enctype="multipart/form-data">
            <div class="modal-scroll-body">
                <div class="form-group">
                    <label for="l-title" data-i18n="manage.lesson_title">Название урока</label>
                    <input type="text" id="l-title" name="title" class="form-input" required data-i18n="group.lesson_title_ph" data-i18n-prop="placeholder" placeholder="Например: Тема 1. Введение" />
                </div>
                <div class="lesson-media-editor" data-lesson-media-editor>
                <p class="form-hint" data-i18n="lesson.media_choice_hint">Можно добавить либо видео, либо картинку</p>
                <div class="form-group" data-lesson-video-field>
                    <label for="l-video" data-i18n="manage.lesson_video">📹 Видео (YouTube ссылка)</label>
                    <input type="url" id="l-video" name="video_url" class="form-input" data-lesson-video-input placeholder="https://youtube.com/watch?v=..." />
                </div>
                <div class="form-group" data-lesson-cover-field>
                    <label for="l-cover" data-i18n="lesson.image_upload">Перетащите или загрузите картинку</label>
                    <label for="l-cover" class="lesson-cover-upload" data-lesson-cover-dropzone>
                        <img data-lesson-cover-preview alt="" hidden />
                        <span data-i18n="lesson.image_upload">Перетащите или загрузите картинку</span>
                        <small>JPG, PNG, WEBP · 5MB</small>
                    </label>
                    <input type="file" id="l-cover" name="cover" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" data-lesson-cover-input hidden />
                    <input type="hidden" name="remove_cover" value="0" data-lesson-cover-remove />
                    <button type="button" class="btn btn-outline btn-sm" data-lesson-cover-remove-btn hidden data-i18n="lesson.image_remove">Удалить картинку</button>
                </div>
                </div>
                <div class="form-group">
                    <label for="l-desc" data-i18n="manage.lesson_desc">Описание урока</label>
                    <div class="rich-editor">
                        <input type="hidden" id="l-desc-input" name="description" class="rich-editor-input" value="" />
                        <div class="rich-editor-shell">
                            <div id="l-desc" class="rich-editor-surface" contenteditable="true"
                                 data-placeholder="Краткое описание урока..."
                                 data-i18n="group.lesson_desc_ph"
                                 data-i18n-prop="data-placeholder"></div>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="l-order" data-i18n="group.order_number">Порядок (номер)</label>
                    <input type="number" id="l-order" name="order" class="form-input" value="{{ group.lessons|length + 1 }}" min="0" />
                </div>
                <div class="form-group">
                    <label for="l-module" data-i18n="group.module">Модуль</label>
                    <select id="l-module" name="group_module_id" class="form-input">
                        <option value="" data-i18n="group.no_module">Без модуля</option>
                        {% for module in group_modules %}
                        <option value="{{ module.id }}">{{ module.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="l-files" data-i18n="manage.lesson_files">📎 Прикрепить материалы (PDF, Word)</label>
                    <input type="file" id="l-files" name="files" multiple class="form-input"
                           accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('add-lesson-modal')" data-i18n="group.cancel">Отмена</button>
                <button type="submit" class="btn btn-primary" data-i18n="manage.lesson_create">Создать урок</button>
            </div>
        </form>
    </div>
</div>
