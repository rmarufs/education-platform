{% set lesson_media_prefix = lesson_media_prefix | default("l") %}
{% set lesson_media_show_video_placeholder = lesson_media_show_video_placeholder | default(false) %}
                <div class="lesson-media-editor" data-lesson-media-editor>
                <p class="form-hint" data-i18n="lesson.media_choice_hint">Можно добавить либо видео, либо картинку</p>
                <div class="form-group" data-lesson-video-field>
                    <label for="{{ lesson_media_prefix }}-video" data-i18n="manage.lesson_video">📹 Видео (YouTube ссылка)</label>
                    <input type="url" id="{{ lesson_media_prefix }}-video" name="video_url" class="form-input" data-lesson-video-input{% if lesson_media_show_video_placeholder %} placeholder="https://youtube.com/watch?v=..."{% endif %} />
                </div>
                <div class="form-group" data-lesson-cover-field>
                    <label for="{{ lesson_media_prefix }}-cover" data-i18n="lesson.image_upload">Перетащите или загрузите картинку</label>
                    <label for="{{ lesson_media_prefix }}-cover" class="lesson-cover-upload" data-lesson-cover-dropzone>
                        <img data-lesson-cover-preview alt="" hidden />
                        <span data-i18n="lesson.image_upload">Перетащите или загрузите картинку</span>
                        <small>JPG, PNG, WEBP · 5MB</small>
                    </label>
                    <input type="file" id="{{ lesson_media_prefix }}-cover" name="cover" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" data-lesson-cover-input hidden />
                    <input type="hidden" name="remove_cover" value="0" data-lesson-cover-remove />
                    <button type="button" class="btn btn-outline btn-sm" data-lesson-cover-remove-btn hidden data-i18n="lesson.image_remove">Удалить картинку</button>
                </div>
                </div>
