<div class="modal-overlay" id="edit-lesson-modal" onclick="if(event.target===this) closeModal('edit-lesson-modal')">
    <div class="modal">
        <div class="modal-header">
            <h2 data-i18n="group.edit_lesson">Редактировать урок</h2>
            <button class="modal-close" onclick="closeModal('edit-lesson-modal')">✕</button>
        </div>
        <form id="edit-lesson-form"{% if lesson_edit_action %} action="{{ lesson_edit_action }}"{% endif %} method="POST" enctype="multipart/form-data">
            <div class="modal-scroll-body">
                <div class="form-group">
                    <label for="el-title" data-i18n="manage.lesson_title">Название урока</label>
                    <input type="text" id="el-title" name="title" class="form-input" required />
                </div>
{% with lesson_media_prefix = "el" %}
{% include "components/authoring/lesson_media_fields.html" %}
{% endwith %}
                <div class="form-group">
                    <label for="el-desc" data-i18n="manage.lesson_desc">Описание урока</label>
                    <div class="rich-editor">
                        <input type="hidden" id="el-desc-input" name="description" class="rich-editor-input" value="" />
                        <div class="rich-editor-shell">
                            <div id="el-desc" class="rich-editor-surface" contenteditable="true"
                                 data-placeholder="Краткое описание урока..."
                                 data-i18n="group.lesson_desc_ph"
                                 data-i18n-prop="data-placeholder"></div>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="el-order" data-i18n="group.order_number">Порядок (номер)</label>
                    <input type="number" id="el-order" name="order" class="form-input" />
                </div>
                <div class="form-group">
                    <label for="el-module" data-i18n="group.module">Модуль</label>
                    <select id="el-module" name="group_module_id" class="form-input">
                        <option value="" data-i18n="group.no_module">Без модуля</option>
                        {% for module in group_modules %}
                        <option value="{{ module.id }}">{{ module.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="el-files" data-i18n="manage.lesson_files">📎 Прикрепить материалы (PDF, Word)</label>
                    <input type="file" id="el-files" name="files" multiple class="form-input"
                           accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('edit-lesson-modal')" data-i18n="group.cancel">Отмена</button>
                <button type="submit" class="btn btn-primary" data-i18n="action.save">Сохранить</button>
            </div>
        </form>
    </div>
</div>
