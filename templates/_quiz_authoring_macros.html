{% macro render_google_forms_editor(quiz_url, scope_name, scope_id, label) %}
<div class="google-forms-editor" data-google-forms-scope="{{ scope_name }}-{{ scope_id }}">
  {% if not quiz_url %}
  <button type="button" 
          class="btn btn-outline btn-sm google-forms-add-btn"
          data-google-forms-action="open"
          data-google-forms-scope-name="{{ scope_name }}"
          data-google-forms-scope-id="{{ scope_id }}"
          data-google-forms-label="{{ label }}"
          data-google-forms-current-url=""
          data-i18n="manage.add_test">
    + Добавить тест
  </button>
  {% else %}
  <div class="google-forms-card">
    <div class="google-forms-header">
      <span class="badge badge-quiz">Google Forms</span>
      <a href="{{ quiz_url }}" target="_blank" rel="noopener" class="btn btn-secondary btn-xs" data-i18n="manage.google_forms_open">📋 Открыть форму</a>
    </div>
    <p class="google-forms-url" title="{{ quiz_url }}">{{ quiz_url | truncate(60, True, '...') }}</p>
    <span class="text-muted small" data-i18n="manage.google_forms_results_hint">Результаты доступны в вашем Google Forms аккаунте</span>
    <div class="google-forms-actions" style="margin-top: 8px; display: flex; gap: 8px;">
      <button type="button"
              class="btn btn-outline btn-xs"
              data-google-forms-action="open"
              data-google-forms-scope-name="{{ scope_name }}"
              data-google-forms-scope-id="{{ scope_id }}"
              data-google-forms-label="{{ label }}"
              data-google-forms-current-url="{{ quiz_url }}">
        ✏️ <span data-i18n="course.edit">Изменить</span>
      </button>
      <button type="button"
              class="btn btn-danger btn-xs"
              data-google-forms-action="delete"
              data-google-forms-scope-name="{{ scope_name }}"
              data-google-forms-scope-id="{{ scope_id }}">
        🗑 <span data-i18n="action.delete">Удалить</span>
      </button>
    </div>
  </div>
  {% endif %}
</div>
{% endmacro %}
