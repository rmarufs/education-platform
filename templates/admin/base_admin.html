<!DOCTYPE html>
<html lang="tj" data-lang="tj" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token(request) }}" />
    <title data-i18n-title="{% block title_key %}{% endblock %}">{% block title %}Панели мудир{% endblock %} — Фурузон</title>
    <script>
    (function () {
      try {
        const root = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'light';
        const savedLang = localStorage.getItem('lang') || 'tj';
        root.dataset.theme = savedTheme;
        root.dataset.lang = savedLang;
        root.lang = savedLang === 'tj' ? 'tj' : 'ru';
        root.classList.toggle('dark', savedTheme === 'dark');
        root.style.colorScheme = savedTheme === 'dark' ? 'dark' : 'light';
      } catch (_) {}
    })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/admin.css?v=3" />
</head>
<body>
    <div class="admin-layout">
        <button class="admin-hamburger" onclick="toggleAdminSidebar()" id="admin-hamburger" type="button">☰</button>
        <div class="admin-sidebar-overlay" id="admin-overlay" onclick="toggleAdminSidebar()"></div>

        <aside class="admin-sidebar" id="admin-sidebar">
            <a href="/admin" class="admin-sidebar-logo">
                <span class="logo-icon">🎓</span>
                <div>
                    <div class="logo-label">Фурузон</div>
                    <div class="logo-sub" data-i18n="admin.layout.panel">Панели идоракунӣ</div>
                </div>
            </a>

            <nav class="admin-nav">
                <a href="/admin" class="admin-nav-link {% if request.url.path == '/admin' %}active{% endif %}">
                    <span class="nav-icon">📊</span>
                    <span data-i18n="admin.nav.home">Шарҳи умумӣ</span>
                </a>
                <a href="/admin/teachers" class="admin-nav-link {% if '/admin/teachers' in request.url.path %}active{% endif %}">
                    <span class="nav-icon">👨‍🏫</span>
                    <span data-i18n="admin.nav.teachers">Дархостҳо</span>
                    {% if pending_count is defined and pending_count > 0 %}
                    <span class="admin-nav-badge">{{ pending_count }}</span>
                    {% endif %}
                </a>
                <a href="/admin/users" class="admin-nav-link {% if '/admin/users' in request.url.path %}active{% endif %}">
                    <span class="nav-icon">👥</span>
                    <span data-i18n="admin.nav.users">Корбарон</span>
                </a>
                <a href="/admin/courses" class="admin-nav-link {% if '/admin/courses' in request.url.path %}active{% endif %}">
                    <span class="nav-icon">📚</span>
                    <span data-i18n="admin.nav.courses">Курсҳо</span>
                </a>
                <a href="/admin/organizations" class="admin-nav-link {% if '/admin/organizations' in request.url.path %}active{% endif %}">
                    <span class="nav-icon">🏢</span>
                    <span>Организации</span>
                </a>
            </nav>

            <div class="admin-sidebar-footer">
                <div class="admin-sidebar-controls">
                    <button class="admin-theme-toggle" id="theme-btn" type="button" onclick="toggleTheme()">🌙</button>
                    <div class="admin-lang-switcher">
                        <button class="lang-btn" id="lang-ru" onclick="setLang('ru')" type="button">RU</button>
                        <span class="lang-divider">|</span>
                        <button class="lang-btn" id="lang-tj" onclick="setLang('tj')" type="button">TJ</button>
                    </div>
                </div>
                <a href="/" class="admin-back-link">
                    <span>←</span>
                    <span data-i18n="admin.layout.back_site">Бозгашт ба сайт</span>
                </a>
            </div>
        </aside>

        <main class="admin-main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div class="admin-modal-overlay" id="admin-confirm-modal" aria-hidden="true" onclick="_resolveAdminConfirmModal(false)">
        <div class="admin-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="admin-confirm-modal-title" onclick="event.stopPropagation()">
            <div class="admin-confirm-modal-header">
                <h2 id="admin-confirm-modal-title"></h2>
                <button class="admin-confirm-modal-close" type="button" onclick="_resolveAdminConfirmModal(false)" aria-label="Close">✕</button>
            </div>
            <p class="admin-confirm-modal-text" id="admin-confirm-modal-hint" hidden></p>
            <div class="admin-confirm-modal-actions">
                <button type="button" class="admin-btn admin-btn-outline" id="admin-confirm-modal-cancel" onclick="_resolveAdminConfirmModal(false)" data-i18n="action.cancel">Отмена</button>
                <button type="button" class="admin-btn admin-btn-danger" id="admin-confirm-modal-ok" onclick="_resolveAdminConfirmModal(true)" data-i18n="confirm.confirm">Подтвердить</button>
            </div>
        </div>
    </div>

    <script src="/static/js/i18n.js?v=8"></script>
    <script src="/static/js/csrf.js?v=1"></script>
    <script>
    let _adminConfirmResolve = null;

    function resolveAdminModalCopy(value, params = {}) {
      if (typeof value !== 'string' || !value) return '';
      if (window.t) {
        const translated = t(value, params);
        if (translated !== value || value.includes('.')) return translated;
      }
      return value;
    }

    function adminInterpolate(text, params = {}) {
      let result = text || '';
      Object.entries(params || {}).forEach(([key, value]) => {
        result = result.replaceAll(`{${key}}`, value);
      });
      return result;
    }

    function showConfirmModal(message, hint = '', confirmText, cancelText, isDanger = true) {
      return new Promise((resolve) => {
        _adminConfirmResolve = resolve;
        const modal = document.getElementById('admin-confirm-modal');
        if (!modal) { resolve(false); return; }
        const normalizedMessage = String(message || '');
        const normalizedHint = String(hint || '');
        const messageParts = !normalizedHint ? normalizedMessage.split(/\n+/) : [normalizedMessage];
        const modalTitle = messageParts.shift().trim();
        const modalHint = normalizedHint || messageParts.join(' ').trim();
        const okBtn = document.getElementById('admin-confirm-modal-ok');
        const cancelBtn = document.getElementById('admin-confirm-modal-cancel');
        const titleEl = document.getElementById('admin-confirm-modal-title');
        const hintEl = document.getElementById('admin-confirm-modal-hint');
        if (titleEl) titleEl.textContent = modalTitle;
        if (hintEl) {
          hintEl.textContent = modalHint;
          hintEl.hidden = !modalHint;
        }
        if (okBtn) {
          okBtn.textContent = confirmText || (window.t ? t('confirm.confirm') : 'Подтвердить');
          okBtn.className = 'admin-btn ' + (isDanger ? 'admin-btn-danger' : 'admin-btn-success');
        }
        if (cancelBtn) cancelBtn.textContent = cancelText || (window.t ? t('action.cancel') : 'Отмена');
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('admin-modal-open');
        okBtn?.focus();
      });
    }

    function _resolveAdminConfirmModal(result) {
      const modal = document.getElementById('admin-confirm-modal');
      if (modal) {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('admin-modal-open');
      }
      if (_adminConfirmResolve) {
        _adminConfirmResolve(result);
        _adminConfirmResolve = null;
      }
    }

    async function confirmAndSubmit(event, message, hint = '', params = null, confirmText, cancelText, isDanger = true) {
      event.preventDefault();
      const form = event.target || event.currentTarget;
      const resolvedParams = params && typeof params === 'object' && !Array.isArray(params) ? params : {};
      const confirmed = await showConfirmModal(
        adminInterpolate(resolveAdminModalCopy(message, resolvedParams), resolvedParams),
        adminInterpolate(resolveAdminModalCopy(hint, resolvedParams), resolvedParams),
        resolveAdminModalCopy(confirmText, resolvedParams),
        resolveAdminModalCopy(cancelText, resolvedParams),
        isDanger,
      );
      if (confirmed) {
        form.onsubmit = null;
        form.submit();
      }
    }

    function syncThemeToggle() {
      const btn = document.getElementById('theme-btn');
      if (!btn) return;
      btn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';
    }

    function toggleAdminSidebar(forceState) {
      const sidebar = document.getElementById('admin-sidebar');
      const overlay = document.getElementById('admin-overlay');
      const shouldOpen = typeof forceState === 'boolean' ? forceState : !sidebar.classList.contains('open');
      sidebar.classList.toggle('open', shouldOpen);
      overlay.classList.toggle('open', shouldOpen);
    }

    function toggleTheme() {
      const root = document.documentElement;
      const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = nextTheme;
      root.classList.toggle('dark', nextTheme === 'dark');
      root.style.colorScheme = nextTheme === 'dark' ? 'dark' : 'light';
      localStorage.setItem('theme', nextTheme);
      syncThemeToggle();
    }

    syncThemeToggle();

    document.addEventListener('click', (event) => {
      const sidebar = document.getElementById('admin-sidebar');
      const hamburger = document.getElementById('admin-hamburger');
      if (window.innerWidth > 768 || !sidebar?.classList.contains('open')) return;
      if (!sidebar.contains(event.target) && !hamburger?.contains(event.target)) {
        toggleAdminSidebar(false);
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        toggleAdminSidebar(false);
        _resolveAdminConfirmModal(false);
      }
    });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
