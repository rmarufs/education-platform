<!DOCTYPE html>
<html lang="tj" data-lang="tj" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-title="{% block title_key %}{% endblock %}">{% block title %}Панели мудир{% endblock %} — Фурузон</title>
    <script>
    (function () {
      try {
        const root = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'light';
        const savedLang = localStorage.getItem('lang') || 'tj';
        root.dataset.theme = savedTheme;
        root.dataset.lang = savedLang;
        root.lang = savedLang === 'tj' ? 'tg' : 'ru';
        root.classList.toggle('dark', savedTheme === 'dark');
        root.style.colorScheme = savedTheme === 'dark' ? 'dark' : 'light';
      } catch (_) {}
    })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/admin.css?v=2" />
</head>
<body>
    <div class="admin-layout">
        <button class="admin-hamburger" onclick="toggleAdminSidebar()" id="admin-hamburger" type="button">☰</button>
        <div class="admin-sidebar-overlay" id="admin-overlay" onclick="toggleAdminSidebar()"></div>

        <aside class="admin-sidebar" id="admin-sidebar">
            <a href="/admin" class="admin-sidebar-logo">
                <span class="logo-icon">🎓</span>
                <div>
                    <div class="logo-label">Фурузон</div>
                    <div class="logo-sub" data-i18n="admin.layout.panel">Панели идоракунӣ</div>
                </div>
            </a>

            <nav class="admin-nav">
                <a href="/admin" class="admin-nav-link {% if request.url.path == '/admin' %}active{% endif %}">
                    <span class="nav-icon">📊</span>
                    <span data-i18n="admin.nav.home">Шарҳи умумӣ</span>
                </a>
                <a href="/admin/teachers" class="admin-nav-link {% if '/admin/teachers' in request.url.path %}active{% endif %}">
                    <span class="nav-icon">👨‍🏫</span>
                    <span data-i18n="admin.nav.teachers">Дархостҳо</span>
                    {% if pending_count is defined and pending_count > 0 %}
                    <span class="admin-nav-badge">{{ pending_count }}</span>
                    {% endif %}
                </a>
                <a href="/admin/users" class="admin-nav-link {% if '/admin/users' in request.url.path %}active{% endif %}">
                    <span class="nav-icon">👥</span>
                    <span data-i18n="admin.nav.users">Корбарон</span>
                </a>
                <a href="/admin/courses" class="admin-nav-link {% if '/admin/courses' in request.url.path %}active{% endif %}">
                    <span class="nav-icon">📚</span>
                    <span data-i18n="admin.nav.courses">Курсҳо</span>
                </a>
                <a href="/admin/organizations" class="admin-nav-link {% if '/admin/organizations' in request.url.path %}active{% endif %}">
                    <span class="nav-icon">🏢</span>
                    <span>Организации</span>
                </a>
            </nav>

            <div class="admin-sidebar-footer">
                <div class="admin-sidebar-controls">
                    <button class="admin-theme-toggle" id="theme-btn" type="button" onclick="toggleTheme()">🌙</button>
                    <div class="admin-lang-switcher">
                        <button class="lang-btn" id="lang-ru" onclick="setLang('ru')" type="button">RU</button>
                        <span class="lang-divider">|</span>
                        <button class="lang-btn" id="lang-tj" onclick="setLang('tj')" type="button">TJ</button>
                    </div>
                </div>
                <a href="/" class="admin-back-link">
                    <span>←</span>
                    <span data-i18n="admin.layout.back_site">Бозгашт ба сайт</span>
                </a>
            </div>
        </aside>

        <main class="admin-main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="/static/js/i18n.js?v=5"></script>
    <script>
    function syncThemeToggle() {
      const btn = document.getElementById('theme-btn');
      if (!btn) return;
      btn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';
    }

    function toggleAdminSidebar(forceState) {
      const sidebar = document.getElementById('admin-sidebar');
      const overlay = document.getElementById('admin-overlay');
      const shouldOpen = typeof forceState === 'boolean' ? forceState : !sidebar.classList.contains('open');
      sidebar.classList.toggle('open', shouldOpen);
      overlay.classList.toggle('open', shouldOpen);
    }

    function toggleTheme() {
      const root = document.documentElement;
      const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = nextTheme;
      root.classList.toggle('dark', nextTheme === 'dark');
      root.style.colorScheme = nextTheme === 'dark' ? 'dark' : 'light';
      localStorage.setItem('theme', nextTheme);
      syncThemeToggle();
    }

    syncThemeToggle();

    document.addEventListener('click', (event) => {
      const sidebar = document.getElementById('admin-sidebar');
      const hamburger = document.getElementById('admin-hamburger');
      if (window.innerWidth > 768 || !sidebar?.classList.contains('open')) return;
      if (!sidebar.contains(event.target) && !hamburger?.contains(event.target)) {
        toggleAdminSidebar(false);
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        toggleAdminSidebar(false);
      }
    });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
