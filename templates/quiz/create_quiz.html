{% extends "base.html" %}
{% block title %}Создать квиз — Фурузон{% endblock %}

{% block content %}
<div class="create-quiz-page">
  <div class="dashboard-header">
    <div>
      <a href="{{ back_url }}" class="back-link">← Назад</a>
      <h1>Создать квиз</h1>
      <p>{{ scope_label }}</p>
    </div>
  </div>

  <div class="create-quiz-container">
    <form action="/quiz/create" method="POST" class="create-quiz-form">
      <input type="hidden" name="{{ scope_name }}_id" value="{{ scope_id }}" />

      <div class="form-group">
        <label for="title" data-i18n="manage.quiz_title">Название квиза</label>
        <input type="text"
               id="title"
               name="title"
               class="form-input"
               placeholder="Название квиза"
               required />
      </div>

      <div class="form-group">
        <label for="passing_score" data-i18n="manage.quiz_passing_score">Проходной балл (%)</label>
        <input type="number"
               id="passing_score"
               name="passing_score"
               class="form-input"
               value="50"
               min="0"
               max="100"
               required />
      </div>

      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" name="save_results" value="true" checked />
          <span data-i18n="manage.quiz_save_results">Сохранять результаты студентов</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" data-i18n="manage.quiz_create">Создать</button>
    </form>
  </div>
</div>
{% endblock %}
